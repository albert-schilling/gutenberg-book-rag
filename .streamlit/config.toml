# A quiet library look: pale grey paper, ink and one muted accent (oxblood, like a cloth binding).
[theme]
base = "light"
primaryColor = "#8c2f39"
backgroundColor = "#f8f8f6"
secondaryBackgroundColor = "#eeeeeb"
textColor = "#25262a"
linkColor = "#8c2f39"
borderColor = "#d9d9d4"
baseRadius = "0.5rem"
headingFont = "serif"
codeFont = "monospace"
chartCategoricalColors = ["#8c2f39", "#7d8fa3", "#4a6b57", "#b5764a", "#6b6d72"]

[theme.sidebar]
backgroundColor = "#eeeeeb"
secondaryBackgroundColor = "#e4e4e0"

[client]
toolbarMode = "minimal"
