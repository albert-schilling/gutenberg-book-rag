[project]
name = "book-rag"
version = "0.1.0"
description = "Retrieval-augmented chat with books from Project Gutenberg: Chroma, e5 embeddings, an evaluation suite"
readme = "README.md"
requires-python = ">=3.13.17"
dependencies = [
    "colorama>=0.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-mistralai>=1.1.6",
    "langchain-text-splitters>=1.1.3",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
]

[project.scripts]
book-rag = "book_rag.cli:main"
book-rag-eval = "book_rag.evaluation.run:main"
book-rag-summarize = "book_rag.summary:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "book_rag"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: uses the real embedding model (cached locally); deselect with -m 'not integration'",
    "live: calls the real language model on Groq (BOOK_RAG_LIVE=1 uv run pytest -m live); skipped otherwise",
    "browser: drives the real app in headless Chromium (uv run playwright install chromium); deselect with -m 'not browser'",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B905"]  # long assertions are easier to read than split ones
"src/book_rag/evaluation/judge.py" = ["E501"]  # the judge prompt is kept as written: it is part of the rubric
