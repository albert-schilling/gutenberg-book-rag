[project]
name = "amle-project-book-rag"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "colorama>=0.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
]

[project.scripts]
book-rag = "book_rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "book_rag"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
